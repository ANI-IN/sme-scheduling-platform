name: Checks

# On every push and pull request: format, lint, types, unit tests, build and the database tests (about 10 minutes).
# The browser tests take hours, so they run only when asked for: Actions, Checks, Run workflow, tick the box.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_tests:
        description: Also run every browser test (about 3 hours of Actions minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format, lint, type check, unit tests, build
        run: npm run check

      - name: Plain wording in user facing text
        run: npm run scan-text -w scripts

      - name: Start the local database
        run: >
          node node_modules/supabase/dist/supabase.js start
          -x studio,postgres-meta,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor

      - name: Database tests
        run: npm run db:test

      - name: Migrations apply cleanly on an empty database
        run: npm run check-migrations -w scripts

      - name: Every rollback undoes its migration
        run: npm run check-rollbacks -w scripts

      - name: Full engine timeline without accounts
        run: npm run mock -- --race

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.browser_tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the test browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Browser tests
        run: npm run e2e

      - name: Integration journey rehearsal (n8n, Discord and Gmail stood in for)
        run: npm run integration:rehearse -w scripts

      - name: Keep the browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/results
          retention-days: 7
