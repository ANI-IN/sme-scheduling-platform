name: Checks

# Lint, type check, unit, database and end to end tests on every push.
on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Production build has no development sign in
        run: npm run check-build -w scripts

      - name: Plain wording in user facing text
        run: npm run scan-text -w scripts

      - name: Start the local database
        run: >
          node node_modules/supabase/dist/supabase.js start
          -x studio,postgres-meta,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor

      - name: Database tests
        run: npm run db:test

      - name: Migrations apply cleanly on an empty database
        run: npm run check-migrations -w scripts

      - name: Full engine timeline without accounts
        run: npm run mock -- --race

      - name: Install the test browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: End to end tests
        run: npm run e2e

      # Runs on the Sandbox starting data the end to end tests leave behind.
      - name: Integration journey rehearsal (n8n, Discord and Gmail stood in for)
        run: npm run integration:rehearse -w scripts

      - name: Keep the end to end results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/results
          retention-days: 14
