<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" role="img" aria-label="The journey of a class">
  <rect width="900" height="190" fill="#ffffff"/>
  <line x1="60" y1="70" x2="840" y2="70" stroke="#c9d1db" stroke-width="4"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="60" cy="70" r="22" fill="#2f5bd3"/><text x="60" y="76" fill="#fff" font-size="16" font-weight="700">1</text>
      <text x="60" y="122" fill="#1f2328" font-size="15" font-weight="600">Planned</text>
      <text x="60" y="142" fill="#59636e" font-size="12">any time</text>
    </g>
    <g>
      <circle cx="216" cy="70" r="22" fill="#2f5bd3"/><text x="216" y="76" fill="#fff" font-size="16" font-weight="700">2</text>
      <text x="216" y="122" fill="#1f2328" font-size="15" font-weight="600">Setup check</text>
      <text x="216" y="142" fill="#59636e" font-size="12">about 45 days before</text>
    </g>
    <g>
      <circle cx="372" cy="70" r="22" fill="#2f5bd3"/><text x="372" y="76" fill="#fff" font-size="16" font-weight="700">3</text>
      <text x="372" y="122" fill="#1f2328" font-size="15" font-weight="600">Asking instructors</text>
      <text x="372" y="142" fill="#59636e" font-size="12">about 30 days before</text>
      <text x="372" y="160" fill="#59636e" font-size="12">one at a time</text>
    </g>
    <g>
      <circle cx="528" cy="70" r="22" fill="#1a7f37"/><text x="528" y="76" fill="#fff" font-size="16" font-weight="700">4</text>
      <text x="528" y="122" fill="#1f2328" font-size="15" font-weight="600">Confirmed</text>
      <text x="528" y="142" fill="#59636e" font-size="12">first Yes wins</text>
    </g>
    <g>
      <circle cx="684" cy="70" r="22" fill="#2f5bd3"/><text x="684" y="76" fill="#fff" font-size="16" font-weight="700">5</text>
      <text x="684" y="122" fill="#1f2328" font-size="15" font-weight="600">Reminders</text>
      <text x="684" y="142" fill="#59636e" font-size="12">10 and 2 days before</text>
    </g>
    <g>
      <circle cx="840" cy="70" r="22" fill="#1a7f37"/><text x="840" y="76" fill="#fff" font-size="16" font-weight="700">6</text>
      <text x="840" y="122" fill="#1f2328" font-size="15" font-weight="600">Taught</text>
      <text x="840" y="142" fill="#59636e" font-size="12">class day</text>
    </g>
  </g>
</svg>
